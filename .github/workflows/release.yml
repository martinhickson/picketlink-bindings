name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: true
        default: "3.0.7"
      picketlink_version:
        description: "PicketLink dependency version (picketlink.version property)"
        required: true
        default: "3.0.7"
      deploy_to_maven_central:
        description: "Publish to Maven Central (io.github.martinhickson)"
        required: false
        default: true
        type: boolean
      central_group_id:
        description: "Maven groupId for Maven Central (verified namespace)"
        required: false
        default: "io.github.martinhickson"
        type: string
      dependency_repository_name:
        description: "Repository name under same owner that hosts Maven packages"
        required: true
        default: "picketlink"
      picketbox_repository_name:
        description: "Repository name under same owner that hosts PicketBox Maven packages"
        required: true
        default: "picketbox"
      xacml_repository_name:
        description: "Repository name under same owner that hosts jbossxacml Maven packages"
        required: true
        default: "security-xacml"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.event.inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      RELEASE_VERSION: ${{ github.event.inputs.version }}
      PICKETLINK_VERSION: ${{ github.event.inputs.picketlink_version }}
      RELEASE_BRANCH: release/${{ github.event.inputs.version }}
      RELEASE_TAG: v${{ github.event.inputs.version }}
      DEPENDENCY_REPOSITORY: https://maven.pkg.github.com/${{ github.repository_owner }}/${{ github.event.inputs.dependency_repository_name }}
      PICKETBOX_REPOSITORY: https://maven.pkg.github.com/${{ github.repository_owner }}/${{ github.event.inputs.picketbox_repository_name }}
      XACML_REPOSITORY: https://maven.pkg.github.com/${{ github.repository_owner }}/${{ github.event.inputs.xacml_repository_name }}
      MAVEN_GITHUB_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17 and Maven auth
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          server-id: github
          server-username: GITHUB_REPOSITORY_OWNER
          server-password: GITHUB_TOKEN

      - name: Configure Maven repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "${MAVEN_GITHUB_TOKEN}" ]; then
            MAVEN_GITHUB_TOKEN="${GITHUB_TOKEN}"
          fi
          echo "MAVEN_GITHUB_TOKEN=${MAVEN_GITHUB_TOKEN}" >> "${GITHUB_ENV}"
          mkdir -p "${HOME}/.m2"
          cat > "${HOME}/.m2/settings.xml" <<'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github</id>
                <username>${env.GITHUB_REPOSITORY_OWNER}</username>
                <password>${env.MAVEN_GITHUB_TOKEN}</password>
              </server>
              <server>
                <id>github-picketbox</id>
                <username>${env.GITHUB_REPOSITORY_OWNER}</username>
                <password>${env.MAVEN_GITHUB_TOKEN}</password>
              </server>
              <server>
                <id>github-xacml</id>
                <username>${env.GITHUB_REPOSITORY_OWNER}</username>
                <password>${env.MAVEN_GITHUB_TOKEN}</password>
              </server>
            </servers>
            <profiles>
              <profile>
                <id>release-repos</id>
                <repositories>
                  <repository>
                    <id>central</id>
                    <url>https://repo.maven.apache.org/maven2</url>
                  </repository>
                  <repository>
                    <id>github</id>
                    <url>${env.DEPENDENCY_REPOSITORY}</url>
                    <releases>
                      <enabled>true</enabled>
                    </releases>
                    <snapshots>
                      <enabled>true</enabled>
                    </snapshots>
                  </repository>
                  <repository>
                    <id>github-picketbox</id>
                    <url>${env.PICKETBOX_REPOSITORY}</url>
                    <releases>
                      <enabled>true</enabled>
                    </releases>
                    <snapshots>
                      <enabled>true</enabled>
                    </snapshots>
                  </repository>
                  <repository>
                    <id>github-xacml</id>
                    <url>${env.XACML_REPOSITORY}</url>
                    <releases>
                      <enabled>true</enabled>
                    </releases>
                    <snapshots>
                      <enabled>true</enabled>
                    </snapshots>
                  </repository>
                </repositories>
                <pluginRepositories>
                  <pluginRepository>
                    <id>central</id>
                    <url>https://repo.maven.apache.org/maven2</url>
                  </pluginRepository>
                </pluginRepositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>release-repos</activeProfile>
            </activeProfiles>
          </settings>
          EOF

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Ensure release branch/tag do not already exist
        run: |
          if git ls-remote --heads origin "${RELEASE_BRANCH}" | grep -q "${RELEASE_BRANCH}"; then
            echo "Release branch already exists: ${RELEASE_BRANCH}"
            exit 1
          fi
          if git ls-remote --tags origin "${RELEASE_TAG}" | grep -q "${RELEASE_TAG}"; then
            echo "Release tag already exists: ${RELEASE_TAG}"
            exit 1
          fi

      - name: Create release branch
        run: |
          git switch -c "${RELEASE_BRANCH}"

      - name: Set Maven version across all modules
        run: |
          mvn -B -ntp versions:set \
            -DnewVersion="${RELEASE_VERSION}" \
            -DprocessAllModules=true \
            -DgenerateBackupPoms=false
          mvn -B -ntp versions:update-child-modules -DgenerateBackupPoms=false
          mvn -B -ntp versions:set-property \
            -Dproperty=picketlink.version \
            -DnewVersion="${PICKETLINK_VERSION}" \
            -DgenerateBackupPoms=false

      - name: Commit release version updates
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No pom version changes to commit."
          else
            git commit -m "Release ${RELEASE_VERSION}: set Maven project versions (picketlink.version=${PICKETLINK_VERSION})"
          fi

      - name: Create release tag
        run: |
          git tag "${RELEASE_TAG}"

      - name: Build and deploy to GitHub Packages (skip tests)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          mvn -B -ntp -DskipTests -Dgpg.skip=true deploy \
            -Dpicketlink.version="${PICKETLINK_VERSION}" \
            -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/${{ github.repository }}

      - name: Publish to Maven Central
        if: github.event.inputs.deploy_to_maven_central == 'true'
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_CENTRAL_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_CENTRAL_GPG_PRIVATE_KEY }}
          MAVEN_CENTRAL_GPG_PASSPHRASE: ${{ secrets.MAVEN_CENTRAL_GPG_PASSPHRASE }}
          CENTRAL_GROUP_ID: ${{ github.event.inputs.central_group_id }}
        run: |
          set -euo pipefail
          if [ -z "${MAVEN_CENTRAL_USERNAME}" ] || [ -z "${MAVEN_CENTRAL_PASSWORD}" ] || [ -z "${MAVEN_CENTRAL_GPG_PRIVATE_KEY}" ]; then
            echo "::error::Maven Central publishing is not configured. Set MAVEN_CENTRAL_USERNAME, MAVEN_CENTRAL_PASSWORD, and MAVEN_CENTRAL_GPG_PRIVATE_KEY."
            exit 1
          fi
          python3 - << 'PY'
          import pathlib, shutil
          root = pathlib.Path('.')
          backup = pathlib.Path('/tmp/pom-backup')
          if backup.exists():
              shutil.rmtree(backup)
          for pom in root.rglob('pom.xml'):
              if '.git' in pom.parts or 'target' in pom.parts:
                  continue
              dest = backup / pom
              dest.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(pom, dest)
          PY
          chmod +x .github/scripts/rewrite-group-id.sh
          .github/scripts/rewrite-group-id.sh org.picketlink.distribution "${CENTRAL_GROUP_ID}"
          .github/scripts/rewrite-group-id.sh org.picketlink "${CENTRAL_GROUP_ID}"
          .github/scripts/rewrite-group-id.sh org.picketbox "${CENTRAL_GROUP_ID}"
          python3 - << PY
          import pathlib, re
          group = "${CENTRAL_GROUP_ID}"
          pat = re.compile(r'<groupId>org\.jboss\.security</groupId>(\s*)<artifactId>jbossxacml</artifactId>')
          repl = '<groupId>%s</groupId>\\1<artifactId>jboss-xacml</artifactId>' % group
          for pom in pathlib.Path('.').rglob('pom.xml'):
              if '.git' in pom.parts or 'target' in pom.parts:
                  continue
              text = pom.read_text()
              new = pat.sub(repl, text)
              new = re.sub(r'<distributionManagement>.*?</distributionManagement>', '', new, flags=re.S)
              if new != text:
                  pom.write_text(new)
          PY
          sed -i "/<\/servers>/i\\
              <server>\\
                <id>central</id>\\
                <username>${MAVEN_CENTRAL_USERNAME}</username>\\
                <password>${MAVEN_CENTRAL_PASSWORD}</password>\\
              </server>" "${HOME}/.m2/settings.xml"
          echo "${MAVEN_CENTRAL_GPG_PRIVATE_KEY}" | gpg --batch --import --pinentry-mode loopback
          mvn -B -ntp deploy -Pcentral-release -DskipTests \
            -Dpicketlink.version="${PICKETLINK_VERSION}" \
            -Dmaven.javadoc.failOnError=false \
            -Dgpg.passphrase="${MAVEN_CENTRAL_GPG_PASSPHRASE}"
          python3 - << 'PY'
          import pathlib, shutil
          backup = pathlib.Path('/tmp/pom-backup')
          for src in backup.rglob('pom.xml'):
              shutil.copy2(src, src.relative_to(backup))
          print('restored poms')
          PY

      - name: Push release branch and tag
        run: |
          git push origin "${RELEASE_BRANCH}"
          git push origin "${RELEASE_TAG}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ env.RELEASE_BRANCH }}
          name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          body: |
            Release ${{ env.RELEASE_VERSION }}

            Maven Central groupId `${{ github.event.inputs.central_group_id }}` (default on).
            GitHub Packages keeps `org.picketlink`.

            ```xml
            <dependency>
              <groupId>${{ github.event.inputs.central_group_id }}</groupId>
              <artifactId>picketlink-wildfly-common</artifactId>
              <version>${{ env.RELEASE_VERSION }}</version>
            </dependency>
            ```
